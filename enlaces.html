<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Galmor Textiles — Enlaces</title>
  <meta name="description" content="Catálogo, WhatsApp y redes de Galmor Textiles. Del taller a tu clóset. Tienda online, envíos a todo el Perú.">
  <meta name="theme-color" content="#fbf6f2">
  <meta property="og:title" content="Galmor Textiles — Del taller a tu clóset">
  <meta property="og:description" content="Tienda online de pantalones. Envíos a todo el Perú.">
  <meta property="og:image" content="marca/portada-modelo.webp">
  <link rel="icon" type="image/png" sizes="32x32" href="marca/icono-32.png">
  <link rel="apple-touch-icon" href="marca/icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="diseno.css">
  <style>
    /* Página de enlaces: simple, con los colores del catálogo. ?desde=instagram oculta Instagram; ?panel muestra los 4 links para copiar. */
    body { min-height: 100vh; background: var(--crema-2, #fbf6f2); color: var(--tinta); }
    .enlaces { max-width: 440px; margin: 0 auto; padding: 56px 22px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .enlaces .logo { color: var(--tinta); }
    .enlaces .logo span { font-size: 40px; }
    .enlaces .logo small { font-size: 14px; }
    .enlaces .logo small::before, .enlaces .logo small::after { width: 40px; }
    .lema { margin-top: 22px; font-size: 16px; color: var(--tinta-2); }
    .lista { list-style: none; padding: 0; margin: 30px 0 0; width: 100%; display: grid; gap: 12px; }
    .enlace { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 18px; border-radius: 10px; text-decoration: none;
      background: #fff; color: var(--tinta); border: 1px solid var(--linea); font: 500 16px var(--texto); transition: border-color .15s, transform .15s; }
    .enlace:hover { border-color: var(--tinta); }
    .enlace:active { transform: scale(.98); }
    .enlace svg { width: 22px; height: 22px; flex: none; color: var(--denim); }
    .enlace span { flex: 1; text-align: left; }
    .enlace::after { content: "→"; color: var(--tinta-3); }
    .enlace.catalogo { min-height: 64px; background: var(--denim); border-color: var(--denim); color: #fff; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .enlace.catalogo svg, .enlace.catalogo::after { color: #fff; }
    .enlaces-pie { margin-top: 34px; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--tinta-3); }

    /* ?panel: los 4 links listos para copiar */
    .panel { width: 100%; max-width: 760px; margin: 0 auto; padding: 40px 20px 48px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .panel h2 { grid-column: 1 / -1; font: 600 28px var(--titulo); text-align: center; text-transform: uppercase; }
    .tarjeta-link { padding: 18px; background: #fff; border: 1px solid var(--linea); border-radius: 10px; }
    .tarjeta-link h3 { font: 600 20px var(--texto); text-transform: none; }
    .tarjeta-link p { margin: 4px 0 10px; font-size: 13px; color: var(--tinta-3); }
    .tarjeta-link input { width: 100%; padding: 10px; border: 1px solid var(--linea); border-radius: 6px; background: var(--crema-2, #fbf6f2); font: 12px monospace; }
    .tarjeta-link button { margin-top: 10px; width: 100%; min-height: 44px; border: 0; border-radius: 6px; background: var(--denim); color: #fff; font: 600 15px var(--texto); text-transform: uppercase; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Bienvenida (la misma del catálogo) -->
  <div id="splash" class="splash" aria-hidden="true">
    <p class="splash-hola">Bienvenido a</p>
    <p class="splash-marca"><span style="--i:0">G</span><span style="--i:1">A</span><span style="--i:2">L</span><span style="--i:3">M</span><span style="--i:4">O</span><span style="--i:5">R</span></p>
    <p class="splash-textiles"><i></i>Textiles<i></i></p>
  </div>

  <main class="enlaces" id="enlaces">
    <a class="logo" href="./" aria-label="Galmor Textiles, ir al catálogo"><span>Galmor</span><small>Textiles</small></a>
    <p class="lema">El pantalón define tu estilo.</p>
    <ul class="lista" id="lista"></ul>
    <p class="enlaces-pie">Envíos a todo el Perú</p>
  </main>

  <section class="panel" id="panel" hidden></section>

  <script src="productos.js"></script>
  <script>
    (() => {
      const C = window.CATALOGO;
      const params = new URLSearchParams(location.search);
      const desde = params.get("desde"); // instagram | facebook | tiktok | whatsapp
      const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Bienvenida: una vez por visita, compartida con el catálogo (misma clave).
      const splash = document.getElementById("splash");
      if (sessionStorage.getItem("galmor_visto") || params.has("panel")) splash.remove();
      else {
        sessionStorage.setItem("galmor_visto", "1");
        setTimeout(() => splash.classList.add("fuera"), quieto ? 900 : 2600);
        setTimeout(() => splash.remove(), quieto ? 1000 : 3500);
      }

      const ICONO = {
        catalogo: '<path d="M5 8h14l-1 13H6z M9 10V6.5a3 3 0 0 1 6 0V10" fill="none" stroke="currentColor" stroke-width="2"/>',
        whatsapp: '<path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.3.3-.1.6.1.3.7 1.1 1.4 1.8.9.8 1.7 1.1 2 1.2.2.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.4.2.5.3.1.2.1.7-.1 1.3z"/>',
        instagram: '<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM16.5 2h-9A5.5 5.5 0 0 0 2 7.5v9A5.5 5.5 0 0 0 7.5 22h9a5.5 5.5 0 0 0 5.5-5.5v-9A5.5 5.5 0 0 0 16.5 2zm3.7 14.5a3.7 3.7 0 0 1-3.7 3.7h-9a3.7 3.7 0 0 1-3.7-3.7v-9a3.7 3.7 0 0 1 3.7-3.7h9a3.7 3.7 0 0 1 3.7 3.7z"/>',
        facebook: '<path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.3 0-1.7.8-1.7 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/>',
        tiktok: '<path d="M16.6 2h-3.3v13.4a2.9 2.9 0 1 1-2-2.8V9.2a6.3 6.3 0 1 0 5.3 6.2V8.6a7.9 7.9 0 0 0 4.4 1.4V6.7a4.6 4.6 0 0 1-4.4-4.7z"/>',
      };
      const NOMBRE = { instagram: "Instagram", facebook: "Facebook", tiktok: "TikTok", whatsapp: "WhatsApp" };
      const saludo = `Hola Galmor 👋 Vengo de ${NOMBRE[desde] || "sus redes"} y quiero ver pantalones 👖`;

      // El catálogo va siempre primero; luego las redes, menos la red desde la que llegó el cliente.
      const enlaces = [
        { k: "catalogo", texto: "Ver catálogo", sub: "Elige modelo, color y talla", url: "./" },
        { k: "whatsapp", texto: "WhatsApp", sub: "Escríbenos, te asesoramos", url: `https://wa.me/${C.whatsapp}?text=${encodeURIComponent(saludo)}` },
        { k: "instagram", texto: "Instagram", sub: "Looks y novedades", url: C.redes.instagram },
        { k: "tiktok", texto: "TikTok", sub: "Videos de la colección", url: C.redes.tiktok },
        { k: "facebook", texto: "Facebook", sub: "Síguenos", url: C.redes.facebook },
      ].filter((e) => e.k !== desde && e.url && e.url !== "#");

      document.getElementById("lista").innerHTML = enlaces.map((e) => `<li><a class="enlace ${e.k}" href="${e.url}"${e.k === "catalogo" ? "" : ' target="_blank" rel="noopener"'}>
        <svg viewBox="0 0 24 24" aria-hidden="true" ${e.k === "catalogo" ? "" : 'fill="currentColor" stroke="none"'}>${ICONO[e.k]}</svg><span>${e.texto}</span></a></li>`).join("");

      // ?panel: para el dueño, en la computadora. Un link por red, con botón Copiar.
      if (params.has("panel")) {
        const base = location.href.split("?")[0];
        const DONDE = {
          instagram: ["Instagram", "", "Editar perfil → Enlaces → Agregar enlace externo"],
          tiktok: ["TikTok", "", "Editar perfil → Sitio web"],
          facebook: ["Facebook", "", "Editar → Información de contacto → Sitio web"],
          whatsapp: ["WhatsApp", "", "WhatsApp Business → Herramientas → Perfil de empresa → Sitio web"],
        };
        document.getElementById("enlaces").hidden = true;
        const panel = document.getElementById("panel");
        panel.hidden = false;
        panel.innerHTML = `<h2>Links para tus redes</h2>` + Object.entries(DONDE).map(([k, [nombre, color, donde]]) => `
          <div class="tarjeta-link" style="--color:${color}"><h3>${nombre}</h3><p>Pégalo en: ${donde}</p>
          <input readonly value="${base}?desde=${k}" aria-label="Link para ${nombre}"><button type="button">Copiar</button></div>`).join("");
        panel.addEventListener("click", async (ev) => {
          const b = ev.target.closest("button");
          if (!b) return;
          const input = b.previousElementSibling;
          try { await navigator.clipboard.writeText(input.value); } catch { input.select(); document.execCommand("copy"); }
          b.textContent = "¡Copiado!";
          setTimeout(() => (b.textContent = "Copiar"), 1500);
        });
      }
    })();
  </script>
</body>
</html>
