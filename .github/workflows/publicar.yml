# Publica la tienda en el servidor Hetzner cada vez que algo llega a main (dueño, 2026-11-08), separada de los
# demás proyectos:
#   - Archivos en /opt/tienda/sitio (carpeta propia); la publicación anterior queda en /opt/tienda/anterior.
#   - Pedidos en /opt/tienda/datos/pedidos.json (no se borran al publicar).
#   - Contenedor propio "tienda" (Node, servidor/server.js): sirve la tienda, recibe pedidos y atiende el panel.
#   - Dirección https://tienda.2-31-21-41.sslip.io: UNA entrada en el Caddyfile compartido de /opt/galmor, solo la
#     primera vez (las de galmor, caudal, marcaya y drogueria-jaen no se tocan).
# Secretos: HETZNER_SSH_KEY (llave de publicación) y TIENDA_PANEL_CLAVE (clave del panel de pedidos).
name: Publicar en el servidor

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Revisar que la tienda esté completa
        run: |
          for f in index.html app.js productos.js estilos.css secciones.css diseno.css pedidos.html legal.html reclamaciones.html servidor/server.js servidor/catalogo-inicial.json panel/xlsx.full.min.js; do test -s "$f" || { echo "Falta $f"; exit 1; }; done
          test -d fotos && test -d marca
          node -e "require('./servidor/server.js')"
      - name: Llave para entrar al servidor
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/servidor && chmod 600 ~/.ssh/servidor
          echo "2.31.21.41 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIY6L7lblxF5UDaLmKg5+EOuaaoBCQr/eNX0cn8hjR7L" > ~/.ssh/known_hosts
      - name: Clave del panel
        env:
          CLAVE: ${{ secrets.TIENDA_PANEL_CLAVE }}
        # La clave viaja por la entrada estándar (no queda en el registro) y se guarda solo en el servidor.
        run: |
          if [ -z "$CLAVE" ]; then echo "::warning::Falta el secreto TIENDA_PANEL_CLAVE: el panel de pedidos queda cerrado."; exit 0; fi
          printf 'PANEL_CLAVE=%s\n' "$CLAVE" | ssh -i ~/.ssh/servidor -o BatchMode=yes root@2.31.21.41 \
            'mkdir -p /opt/tienda && umask 077 && cat > /opt/tienda/.env.nuevo && mv /opt/tienda/.env.nuevo /opt/tienda/.env'
      - name: Copiar archivos
        # Se sube a una carpeta nueva y luego se cambia de golpe: la tienda nunca queda a medias.
        run: |
          tar -czf - index.html app.js productos.js estilos.css secciones.css diseno.css pedidos.html legal.html reclamaciones.html servidor panel fotos marca \
            | ssh -i ~/.ssh/servidor -o BatchMode=yes root@2.31.21.41 '
                set -e
                mkdir -p /opt/tienda/datos && rm -rf /opt/tienda/nuevo && mkdir /opt/tienda/nuevo
                tar -xz -C /opt/tienda/nuevo
                rm -rf /opt/tienda/anterior
                [ -d /opt/tienda/sitio ] && mv /opt/tienda/sitio /opt/tienda/anterior
                mv /opt/tienda/nuevo /opt/tienda/sitio'
      - name: Contenedor y dirección
        run: |
          ssh -i ~/.ssh/servidor -o BatchMode=yes root@2.31.21.41 '
            set -e
            touch /opt/tienda/.env && chmod 600 /opt/tienda/.env
            # Red de Galmor (el proxy puede estar en varias redes; p. ej. 2026-11-08 se sumó la de otro proyecto).
            REDES=$(docker inspect -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{\$k}} {{end}}" galmor-caddy-1)
            RED=$(printf "%s\n" $REDES | grep -x galmor_default || printf "%s\n" $REDES | head -n 1)
            # Reason: se comprueba la red ANTES de quitar la tienda anterior; si algo falla, la tienda sigue en línea.
            docker network inspect "$RED" >/dev/null
            # Se recrea en cada publicación para cargar el servidor nuevo y la clave (los pedidos están en /opt/tienda/datos).
            docker rm -f tienda >/dev/null 2>&1 || true
            docker run -d --name tienda --restart unless-stopped --network "$RED" --env-file /opt/tienda/.env \
              -e SITIO=/srv/sitio -e DATOS=/data -v /opt/tienda:/srv:ro -v /opt/tienda/datos:/data \
              node:24-alpine node /srv/sitio/servidor/server.js >/dev/null
            CF=/opt/galmor/Caddyfile
            if ! grep -q "^tienda.2-31-21-41.sslip.io" "$CF"; then
              cp "$CF" /opt/galmor/Caddyfile.antes-de-tienda.bak
              printf "\ntienda.2-31-21-41.sslip.io {\n\tencode gzip\n\treverse_proxy tienda:80\n}\n" >> "$CF"
              if docker exec galmor-caddy-1 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1; then
                docker exec galmor-caddy-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
              else
                cp /opt/galmor/Caddyfile.antes-de-tienda.bak "$CF"; echo "Caddyfile inválido: se dejó como estaba"; exit 1
              fi
            fi'
      - name: Revisar que la tienda responde
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null https://tienda.2-31-21-41.sslip.io/ && \
              curl -fsS -o /dev/null -w "Panel protegido: %{http_code}\n" https://tienda.2-31-21-41.sslip.io/api/panel/pedidos || true
            curl -fsS -o /dev/null https://tienda.2-31-21-41.sslip.io/ && { echo "Tienda en línea"; exit 0; }
            sleep 5
          done
          echo "La tienda no responde"; exit 1
